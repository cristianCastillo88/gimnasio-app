# ======================================================================
# GymApp - Docker Compose Producción (Oracle Cloud Ubuntu ARM64)
# Coexistencia Aislada con Atlas Food (name: gymapp)
# ======================================================================
name: gymapp

services:
  gymapp-db:
    image: postgres:17-alpine
    container_name: gymapp-db
    restart: always
    environment:
      POSTGRES_DB: gymapp_db
      POSTGRES_USER: gymapp_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - gymapp_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gymapp_user -d gymapp_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - gymapp-net

  gymapp-api:
    image: ghcr.io/cristiancastillo88/gimnasio-app:latest
    container_name: gymapp-api
    restart: always
    depends_on:
      gymapp-db:
        condition: service_healthy
    ports:
      # Expuesto ÚNICAMENTE a localhost para ser consumido por el Nginx del host
      - "127.0.0.1:5055:5000"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:5000
      ConnectionStrings__DefaultConnection: Host=gymapp-db;Port=5432;Database=gymapp_db;Username=gymapp_user;Password=${POSTGRES_PASSWORD}
      Jwt__SecretKey: ${JWT_SECRET_KEY}
      Jwt__Issuer: GymAppApi
      Jwt__Audience: GymAppClient
      Cors__AllowedOrigins__0: ${CORS_ALLOWED_ORIGIN}
      App__ClientBaseUrl: ${CORS_ALLOWED_ORIGIN}
      Email__SmtpHost: ${EMAIL_SMTP_HOST:-}
      Email__SmtpPort: ${EMAIL_SMTP_PORT:-587}
      Email__Username: ${EMAIL_USERNAME:-}
      Email__Password: ${EMAIL_PASSWORD:-}
      Email__FromEmail: ${EMAIL_FROM_EMAIL:-no-reply@gymapp.com}
      Email__FromName: GymApp
    networks:
      - gymapp-net

volumes:
  gymapp_pgdata:
    name: gymapp_pgdata

networks:
  gymapp-net:
    name: gymapp-net
