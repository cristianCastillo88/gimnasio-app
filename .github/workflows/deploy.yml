name: Build & Deploy GymApp Backend

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'docker-compose.prod.yml'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    name: Run Backend Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Run Tests
        run: dotnet test backend/tests/GymApp.Api.Tests/GymApp.Api.Tests.csproj -c Release --verbosity normal

  build-and-push:
    name: Build & Push ARM64 Container to GHCR (Native ARM64 Runner)
    needs: test
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Downcase Repository Name for Docker Tag
        id: repo_name
        run: echo "IMAGE_NAME=ghcr.io/${{ github.repository_owner }}/gimnasio-app:latest" | tr '[:upper:]' '[:lower:]' >> "$GITHUB_ENV"

      - name: Build and Push Docker Image (linux/arm64)
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ env.IMAGE_NAME }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Oracle Cloud VM
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Check SSH Configuration
        id: check_ssh
        env:
          SSH_HOST: ${{ secrets.ORACLE_SSH_HOST }}
        run: |
          if [ -z "$SSH_HOST" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "⚠️ Secret ORACLE_SSH_HOST no configurado aún en el repositorio. Saltando despliegue SSH automático."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Execute Remote Deploy via SSH
        if: steps.check_ssh.outputs.configured == 'true'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.ORACLE_SSH_HOST }}
          username: ${{ secrets.ORACLE_SSH_USER || 'ubuntu' }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          port: ${{ secrets.ORACLE_SSH_PORT || 22 }}
          script: |
            set -e
            echo "🚀 Iniciando despliegue de GymApp..."
            
            DEPLOY_DIR="/home/ubuntu/gimnasio-app"
            if [ ! -d "$DEPLOY_DIR" ]; then
              echo "Directorio $DEPLOY_DIR no existe aún. Debe clonarse previamente."
              exit 1
            fi
            
            cd "$DEPLOY_DIR"
            
            # 1. Sincronizar repositorio para actualizar docker-compose.prod.yml y configuraciones
            echo "📥 Sincronizando repositorio Git (docker-compose y configs)..."
            git pull origin main
            
            # 2. Actualizar imagen desde GHCR
            echo "📦 Descargando última imagen de ghcr.io..."
            docker compose -f docker-compose.prod.yml pull gymapp-api
            
            # 3. Recrear contenedor de la API en caliente
            echo "🔄 Levantando servicios de GymApp..."
            docker compose -f docker-compose.prod.yml up -d
            
            # 4. Limpieza segura de imágenes huérfanas (sin -a para proteger Atlas Food)
            echo "🧹 Limpieza segura de imágenes dangling..."
            docker image prune -f
            
            echo "✅ Despliegue de GymApp completado exitosamente."
