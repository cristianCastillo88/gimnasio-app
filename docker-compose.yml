services:
  gymapp-db:
    image: postgres:16-alpine
    container_name: gymapp_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: gymapp_user
      POSTGRES_PASSWORD: gymapp_secret_password
      POSTGRES_DB: gymapp_db
    ports:
      - "5432:5432"
    volumes:
      - gymapp_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gymapp_user -d gymapp_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  gymapp_pgdata:
    driver: local
